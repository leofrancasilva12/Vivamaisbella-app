<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{background:#EEE8E0;color:#3B2616;font-family:'Jost',sans-serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:460px;margin:0 auto;padding:24px 20px 32px;min-height:100vh;display:flex;flex-direction:column;gap:20px}
.arte{width:100%;aspect-ratio:1;border-radius:28px;display:block;box-shadow:0 18px 40px rgba(59,38,22,.16);animation:entra .7s cubic-bezier(.2,.7,.3,1) both}
h1{font-family:'Cormorant Garamond',serif;font-size:34px;font-weight:600;line-height:1.1;text-align:center;animation:entra .7s .12s cubic-bezier(.2,.7,.3,1) both}
p{font-size:16px;line-height:1.65;color:#5C4434;text-align:center;animation:entra .7s .2s cubic-bezier(.2,.7,.3,1) both}
.ass{font-family:'Cormorant Garamond',serif;font-style:italic;font-weight:600;font-size:22px;color:#6B4A35;text-align:center;line-height:1.2}
.ass small{display:block;font-family:'Jost',sans-serif;font-style:normal;font-weight:400;font-size:12px;letter-spacing:.2em;color:#7A6556;margin-top:4px}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;min-height:54px;border-radius:16px;background:#3B2616;color:#F8F2E9;text-decoration:none;font-size:16px;font-weight:500;letter-spacing:.03em}
.btn svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.rod{font-size:12px;letter-spacing:.2em;color:#9C8574;text-align:center;margin-top:auto}
.fechar{position:fixed;top:calc(12px + env(safe-area-inset-top));right:12px;z-index:10;width:44px;height:44px;border-radius:22px;border:1px solid #DCCFC0;background:#FAF7F2;color:#3B2616;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 4px 12px rgba(59,38,22,.12)}
.wrap{padding-top:68px}
.aviso{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#3B2616;color:#F8F2E9;padding:12px 18px;border-radius:99px;font-size:14px;max-width:90vw;text-align:center;z-index:20}
@keyframes entra{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.arte,h1,p{animation:none}}
</style>
</head>
<body>
<button class="fechar" id="fechar" aria-label="Fechar"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
<main class="wrap">
  <img class="arte" src="img/parabens.jpg" alt="Viva Mais Bella: Feliz aniversário">
  <h1 id="titulo">Feliz aniversário!</h1>
  <p>Que o seu novo ano seja de muita saúde, beleza e bem-estar. Obrigada por deixar a Viva Mais Bella fazer parte do seu cuidado. Hoje o dia é todo seu!</p>
  <div class="ass">Com carinho, Rauana Ferreira<small>VIVA MAIS BELLA</small></div>
  <a class="btn" id="wa" href="https://wa.me/5571991158054" target="_blank" rel="noopener"><svg viewBox="0 0 24 24"><path d="M20 11.5a8 8 0 0 1-11.8 7L4 20l1.5-4A8 8 0 1 1 20 11.5z"/></svg>Responder para a Rauana</a>
  <div class="rod">SAÚDE · BELEZA · BEM-ESTAR</div>
</main>
<script>
// O nome vem do link (?n=Ana). Só o primeiro nome, só letras.
const WHATS_CLINICA = '5571991158054';
const n = (new URLSearchParams(location.search).get('n') || '').replace(/[^\p{L} '-]/gu, '').trim().split(/\s+/)[0].slice(0, 30);
if (n) { document.getElementById('titulo').textContent = `Feliz aniversário, ${n}!`; document.title = `Feliz aniversário, ${n} · Viva Mais Bella`; }
document.getElementById('wa').href = `https://wa.me/${WHATS_CLINICA}?text=${encodeURIComponent(`Oi, Rauana! ${n ? 'Aqui é ' + n + '. ' : ''}Obrigada pelo carinho no meu aniversário!`)}`;
// Fechar: volta para a conversa do WhatsApp (ou fecha a aba)
document.getElementById('fechar').addEventListener('click', () => {
  if (history.length > 1) history.back();
  setTimeout(() => {
    try { window.close(); } catch (e) {}
    setTimeout(() => {
      if (document.querySelector('.aviso')) return;
      const a = document.createElement('div'); a.className = 'aviso'; a.textContent = 'Para sair, use o botão voltar do celular ou feche esta aba.';
      document.body.appendChild(a); setTimeout(() => a.remove(), 3500);
    }, 250);
  }, 250);
});
</script>
</body>
