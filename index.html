<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#EEE8E0;--card:#FAF7F2;--ink:#3B2616;--ink2:#5C4434;--muted:#7A6556;--accent:#8E6F5D;--link:#6B4A35;--soft:#E6D6C4;--line:#E2D8CC;--divider:#EDE5DA;--field:#DCCFC0;--chip:#CDBEAD;--onink:#F8F2E9;--ok:#5E7255;--okbg:#E4E9DF;--oktext:#3F5236;--warnbg:#F1E2CF;--warntext:#7A4A2A;--dot:#9C6B4E;--ring:rgba(59,38,22,.14)}
html,body{background:var(--bg);color:var(--ink);font-family:'Jost',sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;padding-bottom:calc(92px + env(safe-area-inset-bottom))}
body.sem-nav{padding-bottom:24px}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--link)}
.serif{font-family:'Cormorant Garamond',serif}
.wrap{max-width:560px;margin:0 auto;padding:22px 20px 0;display:flex;flex-direction:column;gap:18px}
h1.t{font-family:'Cormorant Garamond',serif;font-size:32px;font-weight:600;line-height:1.08}
h2.s{font-family:'Cormorant Garamond',serif;font-size:23px;font-weight:600}
.tag{font-size:12px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}.ink2{color:var(--ink2)}
.card{background:var(--card);border-radius:20px;padding:16px}
.row{display:flex;align-items:center;gap:12px}
.between{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.stack{display:flex;flex-direction:column;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.stat{border-radius:18px;padding:14px 14px 12px;background:var(--card);display:flex;flex-direction:column;gap:2px}
.stat b{font-family:'Cormorant Garamond',serif;font-size:34px;line-height:1}
.stat span{font-size:12px;color:var(--ink2)}
.stat.dark{background:var(--ink);color:var(--onink)}.stat.dark span{color:var(--soft)}
.stat.soft{background:var(--soft)}
.item{display:flex;align-items:center;gap:14px;background:var(--card);border-radius:18px;padding:12px 14px;text-decoration:none;color:inherit;min-height:64px;border:0;width:100%;text-align:left;cursor:pointer}
.item .hora{width:52px;flex-shrink:0;display:flex;flex-direction:column;align-items:center;border-right:1px solid var(--line);padding-right:12px}
.item .hora b{font-size:16px}.item .hora small{font-size:11px;color:var(--muted)}
.item .txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.item .txt b{font-weight:500;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .txt span{font-size:13px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .txt small{font-size:12px;color:var(--muted)}
.badge{font-size:11px;font-weight:600;letter-spacing:.04em;border-radius:10px;padding:4px 8px;white-space:nowrap}
.b-warn{background:var(--warnbg);color:var(--warntext)}.b-ok{background:var(--okbg);color:var(--oktext)}.b-ink{background:var(--ink);color:var(--onink)}
.av{width:42px;height:42px;flex-shrink:0;border-radius:21px;background:var(--soft);display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:600;color:var(--ink2)}
.av.g{width:56px;height:56px;border-radius:28px;font-size:18px}
.bar{width:56px;height:5px;border-radius:3px;background:var(--line);overflow:hidden}.bar i{display:block;height:100%;background:var(--ink);border-radius:3px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;border-radius:16px;border:0;background:var(--ink);color:var(--onink);font-size:16px;font-weight:500;letter-spacing:.03em;padding:0 20px;text-decoration:none;cursor:pointer;width:100%}
.btn.sm{min-height:42px;font-size:14px;border-radius:12px;width:auto;padding:0 14px}
.btn.ghost{background:transparent;color:var(--ink2);border:1px solid var(--chip)}
.btn.soft{background:var(--card);color:var(--ink);border:1px solid var(--field)}
.btn:disabled{opacity:.6}
.icon-btn{width:44px;height:44px;border-radius:22px;border:1px solid var(--field);background:var(--card);display:inline-flex;align-items:center;justify-content:center;color:var(--ink);text-decoration:none;cursor:pointer;flex-shrink:0}
.icon-btn.plain{border:0;background:transparent}
.icon-btn.acc{background:var(--accent);color:#fff;border:0}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
label.f,.f{display:flex;flex-direction:column;gap:7px;font-size:13px;font-weight:500;letter-spacing:.03em;color:var(--ink2)}
.inp{width:100%;min-height:50px;border:1px solid var(--field);border-radius:14px;background:#fff;padding:0 14px;font-size:16px;color:var(--ink);outline:none}
textarea.inp{padding:12px 14px;min-height:90px;resize:vertical}
.inp:focus{border-color:var(--ink);box-shadow:0 0 0 3px var(--ring)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:40px;padding:0 14px;border-radius:20px;border:1px solid var(--chip);background:transparent;color:var(--ink2);font-size:14px;cursor:pointer;white-space:nowrap}
.chip.on{background:var(--ink);border-color:var(--ink);color:var(--onink)}
.empty{border:1.5px dashed var(--chip);border-radius:16px;padding:18px;text-align:center;font-size:14px;color:var(--ink2)}
.alerta{background:var(--warnbg);border-radius:14px;padding:12px 14px;color:var(--warntext);font-size:14px;display:flex;flex-direction:column;gap:4px}
.alerta b{font-size:11px;letter-spacing:.2em}
.plano-card{background:var(--ink);color:var(--onink);border-radius:22px;padding:18px;display:flex;align-items:center;gap:16px}
.ses{display:flex;align-items:center;gap:14px;min-height:60px;border-bottom:1px solid var(--divider)}
.ses:last-child{border-bottom:0}
.dot{width:30px;height:30px;flex-shrink:0;border-radius:15px;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600}
.d-ok{background:var(--ok);color:#fff}.d-next{border:2px solid var(--ink)}.d-pend{border:1.5px dashed var(--chip);color:var(--muted);font-weight:400}
.fab{position:fixed;right:20px;bottom:calc(104px + env(safe-area-inset-bottom));width:58px;height:58px;border-radius:29px;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;border:0;box-shadow:0 10px 24px rgba(59,38,22,.25);cursor:pointer}
nav.tab{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:10px 0 calc(10px + env(safe-area-inset-bottom));z-index:5}
nav.tab a{min-width:64px;min-height:44px;display:flex;flex-direction:column;align-items:center;gap:4px;text-decoration:none;color:var(--muted);font-size:11px;font-weight:500}
nav.tab a.on{color:var(--ink);font-weight:600}
.sheet-bg{position:fixed;inset:0;background:rgba(43,28,16,.55);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--card);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:28px 28px 0 0;padding:10px 20px calc(24px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:14px}
.sheet .grip{align-self:center;width:40px;height:5px;border-radius:3px;background:var(--chip)}
.seg{display:flex;gap:6px;background:#EEE6DC;border-radius:14px;padding:4px}
.seg button{flex:1;min-height:40px;border:0;border-radius:10px;background:transparent;color:var(--ink2);font-size:14px;cursor:pointer}
.seg button.on{background:#fff;color:var(--ink);font-weight:600;box-shadow:0 1px 3px rgba(59,38,22,.15)}
.switch{display:flex;align-items:center;justify-content:space-between;min-height:44px;gap:12px;font-size:15px;cursor:pointer}
.switch input{width:22px;height:22px;accent-color:var(--ink)}
.toast{position:fixed;left:50%;bottom:calc(110px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--onink);padding:12px 20px;border-radius:99px;font-size:14px;z-index:40;max-width:90vw;text-align:center}
.secao{border-top:1px solid var(--divider);padding:12px 0;display:flex;flex-direction:column;gap:6px}
.secao .tag{color:var(--link)}
.lin{display:flex;gap:10px;font-size:14px}.lin span{color:var(--muted);flex:0 0 46%}.lin b{font-weight:500}
.carregando{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;min-height:70vh;color:var(--muted)}
.login{max-width:420px;margin:0 auto;padding:64px 28px 32px;min-height:100vh;display:flex;flex-direction:column;gap:16px}
[hidden]{display:none!important}
.chip-op{position:relative}
.chip-op input{position:absolute;opacity:0;pointer-events:none}
.chip-op span{display:inline-flex;align-items:center;min-height:40px;padding:6px 14px;border-radius:20px;border:1px solid var(--chip);background:#fff;color:var(--ink2);font-size:14px;cursor:pointer;line-height:1.3}
.chip-op input:checked+span{background:var(--ink);border-color:var(--ink);color:var(--onink)}
.chip-op input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
.q-nota{font-size:13px;line-height:1.5;color:var(--ink2);background:var(--soft);padding:8px 12px;border-radius:10px}
.q-tema{font-family:'Cormorant Garamond',serif;font-size:20px;font-style:italic;font-weight:600;color:var(--accent)}
.av{position:relative;overflow:hidden}
.av img{width:100%;height:100%;object-fit:cover;display:block}
.av.xg{width:96px;height:96px;border-radius:48px;font-size:30px}
.av-btn{position:relative;border:0;padding:0;background:transparent;cursor:pointer;flex-shrink:0;border-radius:50%;color:inherit}
.av-btn .cam{position:absolute;right:-3px;bottom:-3px;width:26px;height:26px;border-radius:13px;background:var(--ink);color:var(--onink);display:flex;align-items:center;justify-content:center;border:2px solid var(--bg)}
.av-btn .cam svg.i{width:14px;height:14px;stroke-width:2}
.oculto{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
label.btn{position:relative}
nav.tab a{flex:1;min-width:0}
.preco{font-family:'Cormorant Garamond',serif;font-size:21px;font-weight:600;white-space:nowrap;line-height:1.1}
/* Barra de baixo: pílula atrás do ícone da aba ativa */
nav.tab{padding:8px 4px calc(10px + env(safe-area-inset-bottom))}
nav.tab a{gap:3px;letter-spacing:.01em}
nav.tab .ic{width:56px;height:32px;border-radius:16px;display:flex;align-items:center;justify-content:center;transition:background .25s ease}
nav.tab .ic svg.i{width:24px;height:24px;stroke-width:1.6}
nav.tab a.on .ic{background:var(--soft)}
/* Campo de data e horário + janela do calendário no tema do app */
.campo-dh{display:flex;align-items:center;gap:10px;text-align:left;cursor:pointer;font-weight:400;letter-spacing:0}
.campo-dh svg.i{color:var(--accent);flex-shrink:0}
.campo-dh .vazio{color:var(--muted)}
.pk-bg{position:fixed;inset:0;background:rgba(43,28,16,.55);z-index:30;display:flex;align-items:flex-end;justify-content:center;animation:vmbFundo .2s ease-out both}
.pk-mes{display:flex;align-items:center;justify-content:space-between}
.pk-mes b{font-family:'Cormorant Garamond',serif;font-size:23px;font-weight:600}
.pk-grade{display:grid;grid-template-columns:repeat(7,1fr);row-gap:2px;text-align:center;align-items:center}
.pk-grade .sem{font-size:11px;font-weight:600;letter-spacing:.12em;color:var(--muted);padding:2px 0 6px}
.pk-grade button{width:42px;height:42px;justify-self:center;border:0;background:transparent;border-radius:21px;font-size:15px;color:var(--ink);cursor:pointer;transition:background .15s}
.pk-grade button.passou{color:#B3A293}
.pk-grade button.hoje{box-shadow:inset 0 0 0 1.5px var(--accent);color:var(--accent);font-weight:600}
.pk-grade button.on{background:var(--ink);color:var(--onink);font-weight:600;box-shadow:none}
.pk-horas{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 6px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.pk-horas::-webkit-scrollbar{display:none}
.pk-horas .chip{flex-shrink:0;background:#fff}
.pk-horas .chip.on{background:var(--ink)}
/* Pedidos de horário e aviso na barra */
nav.tab .ic{position:relative}
.nbadge{position:absolute;top:-2px;right:8px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:#B5562F;color:#fff;font-size:11px;font-weight:600;font-style:normal;display:flex;align-items:center;justify-content:center;border:2px solid var(--card)}
.pedido-card{border:1.5px solid var(--soft)}
.pedido-quando{display:flex;align-items:center;gap:12px;background:var(--bg);border-radius:14px;padding:10px 14px}
.pedido-quando svg.i{color:var(--accent);flex-shrink:0}
.pedido-quando b{display:block;font-weight:600;font-size:15px}.pedido-quando span{font-size:13px;color:var(--ink2)}
/* Horários livres */
.hor-grade button.tem{position:relative}
.hor-grade button.tem::after{content:"";position:absolute;left:50%;bottom:4px;width:5px;height:5px;margin-left:-2.5px;border-radius:3px;background:var(--ok)}
.hor-grade button.on.tem::after{background:var(--onink)}
.hor-grade button:disabled{color:#C9BBAD;cursor:default}
.hor-grade button.fechado:not(.on){color:#B3A293;text-decoration:line-through}
.hor-grade button.fer::before{content:"";position:absolute;left:50%;top:3px;width:5px;height:5px;margin-left:-2.5px;border-radius:3px;background:#B5562F}
.hor-grade button.fer{position:relative}
.legenda{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted)}
.legenda span{display:flex;align-items:center;gap:6px}
i.ponto.fer{background:#B5562F}
i.risco{font-style:normal;text-decoration:line-through;color:#B3A293;font-size:12px}
.fer-lin{display:flex;justify-content:space-between;align-items:center;width:100%;min-height:46px;border:0;border-bottom:1px solid var(--divider);background:transparent;font-size:14px;color:var(--ink);cursor:pointer;text-align:left;gap:10px}
.fer-lin:last-child{border-bottom:0}.fer-lin small{color:var(--muted);font-size:12px;white-space:nowrap}
i.ponto{display:inline-block;width:6px;height:6px;border-radius:3px;background:var(--ok)}
.hor-horas{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.hchip{min-height:50px;border-radius:14px;border:1px solid var(--chip);background:#fff;color:var(--ink2);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;padding:4px 2px}
.hchip b{font-size:14px;font-weight:500}.hchip small{font-size:10px;line-height:1.1;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hchip.on{background:var(--ink);border-color:var(--ink);color:var(--onink)}.hchip.on b{font-weight:600}
.hchip.oc{border-style:dashed;background:var(--warnbg);color:var(--warntext)}
.hchip.on.oc{background:var(--ink);color:var(--onink);border-style:solid}
.hchip:disabled{opacity:.35;cursor:default}
/* Janela de confirmação (substitui as caixas do sistema) */
@keyframes vmbDlg{from{opacity:0;transform:translateY(12px) scale(.96)}to{opacity:1;transform:none}}
.dlg-bg{position:fixed;inset:0;z-index:60;background:rgba(43,28,16,.55);display:flex;align-items:center;justify-content:center;padding:24px;animation:vmbFundo .18s ease-out both}
#dialogo.sai .dlg-bg{opacity:0;transition:opacity .18s}
.dlg{background:var(--card);width:100%;max-width:360px;border-radius:26px;padding:24px 20px 18px;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;box-shadow:0 24px 60px rgba(43,28,16,.3);animation:vmbDlg .24s cubic-bezier(.2,.7,.3,1) both}
.dlg h2.s{font-size:25px;line-height:1.15}
.dlg p{font-size:14px;line-height:1.55;margin-bottom:4px;width:100%}
.dlg-ic{width:54px;height:54px;border-radius:27px;background:var(--soft);color:var(--ink);display:flex;align-items:center;justify-content:center;margin-bottom:2px}
.dlg-ic svg.i{width:26px;height:26px}
.dlg-ic.perigo{background:#F3DDD3;color:#9A3F1E}
.dlg-trava{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--ink2);text-align:left;background:var(--bg);border-radius:12px;padding:10px 12px;width:100%;cursor:pointer}
.dlg-trava input{width:20px;height:20px;accent-color:#9A3F1E;flex-shrink:0}
.dlg-bts{display:flex;gap:10px;width:100%;margin-top:6px}
.dlg-bts .btn{flex:1;min-height:48px;font-size:15px;padding:0 10px}
.btn.perigo{background:#9A3F1E;color:#fff}
/* Transições suaves: tela nova entra deslizando de leve; folhas sobem de baixo */
@keyframes vmbEntra{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes vmbFundo{from{opacity:0}to{opacity:1}}
@keyframes vmbSobe{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
.entra{animation:vmbEntra .32s cubic-bezier(.2,.7,.3,1) both}
.sheet-bg{animation:vmbFundo .22s ease-out both}
.sheet{animation:vmbSobe .28s cubic-bezier(.2,.7,.3,1) both}
@media (prefers-reduced-motion:reduce){.entra,.sheet-bg,.sheet{animation:none}}
/* Abertura: vídeo quando o app abre do zero; nas outras entradas, a mesma imagem parada. Um toque pula */
#abertura{position:fixed;inset:0;z-index:100;background:#EDE1D1;display:flex;align-items:center;justify-content:center;transition:opacity .45s ease;cursor:pointer}
#abertura video,#abertura img{width:min(100vw,100vh);height:min(100vw,100vh);object-fit:cover;-webkit-mask-image:radial-gradient(circle,#000 58%,transparent 72%);mask-image:radial-gradient(circle,#000 58%,transparent 72%)}
#abertura.sai{opacity:0;pointer-events:none}
#abertura small{position:absolute;bottom:calc(28px + env(safe-area-inset-bottom));font-size:12px;letter-spacing:.2em;color:#9C8574}
</style>
</head>
<body class="sem-nav">
<script>
(function () {
  // sessionStorage some quando o app é fechado de vez: aí a próxima abertura mostra o vídeo
  let doZero = true;
  try { doZero = !sessionStorage.getItem('vmb-sessao'); sessionStorage.setItem('vmb-sessao', '1'); } catch (e) {}
  const el = document.createElement('div');
  el.id = 'abertura';
  el.setAttribute('aria-label', 'Viva Mais Bella. Toque para pular.');
  el.innerHTML = doZero ? '<video src="abertura.mp4" muted playsinline autoplay preload="auto"></video><small>TOQUE PARA PULAR</small>'
    : '<img src="img/abertura-final.jpg" alt="Viva Mais Bella">';
  document.body.appendChild(el);
  let fechado = false;
  const fechar = () => { if (fechado) return; fechado = true; el.classList.add('sai'); setTimeout(() => el.remove(), 500); };
  el.addEventListener('click', fechar);
  if (doZero) {
    const v = el.querySelector('video');
    v.addEventListener('ended', fechar);
    v.addEventListener('error', fechar);
    setTimeout(fechar, 8000);
    const p = v.play && v.play();
    if (p && p.catch) p.catch(fechar);
  } else {
    // imagem parada: fica até o app carregar (no mínimo 0,9 s, no máximo 4 s)
    const t0 = Date.now();
    document.addEventListener('vmb-pronto', () => setTimeout(fechar, Math.max(0, 900 - (Date.now() - t0))), { once: true });
    setTimeout(fechar, 4000);
  }
})();
</script>
