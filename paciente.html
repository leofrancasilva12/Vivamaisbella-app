<script>
(function () {
  let visto = false;
  try { visto = !!sessionStorage.getItem('vmb-cliente-video'); sessionStorage.setItem('vmb-cliente-video', '1'); } catch (e) {}
  if (visto) return;
  const el = document.createElement('div');
  el.id = 'abertura';
  el.setAttribute('aria-label', 'Viva Mais Bella. Toque para pular.');
  el.innerHTML = '<video src="abertura.mp4" muted playsinline autoplay preload="auto"></video><small>TOQUE PARA PULAR</small>';
  document.body.appendChild(el);
  const v = el.querySelector('video');
  let fechado = false;
  const fechar = () => { if (fechado) return; fechado = true; el.classList.add('sai'); setTimeout(() => el.remove(), 500); };
  v.addEventListener('ended', fechar);
  v.addEventListener('error', fechar);
  el.addEventListener('click', fechar);
  setTimeout(fechar, 8000);
  const p = v.play && v.play();
  if (p && p.catch) p.catch(fechar);
})();
</script>

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const pad = n => String(n).padStart(2, '0');

const rpc = async (nome, corpo) => { const r = await fetch(`${SB_URL}/rest/v1/rpc/${nome}`, { method: 'POST', headers: cab, body: JSON.stringify(corpo) }); const j = await r.json().catch(() => null); if (!r.ok) throw Object.assign(new Error((j && j.message) || 'erro'), { codigo: j && j.message }); return j; };
const diaKey = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());

const I = {

};

// Botão Fechar: volta para onde estava; se não der, fecha a janela; dentro do app instalado, volta para o Início do app
$('#fechar').addEventListener('click', () => {
  const noApp = matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;

    setTimeout(() => { if (noApp) return location.replace('/'); aviso('Para sair, use o botão voltar do celular ou feche esta aba.'); }, 250);
  }, 250);

let P = null, FOTO = '';
function desenhar() {
  const p = P;
  const feitas = p.sessoes.filter(s => s.status === 'concluida').length;
  const prox = p.sessoes.find(s => s.status !== 'concluida' && s.data_hora);
  const C = 402.1, fr = feitas / p.total_sessoes;
  const meses = ['JAN', 'FEV', 'MAR', 'ABR', 'MAI', 'JUN', 'JUL', 'AGO', 'SET', 'OUT', 'NOV', 'DEZ'];
  const semana = ['Domingo', 'Segunda-feira', 'Terça-feira', 'Quarta-feira', 'Quinta-feira', 'Sexta-feira', 'Sábado'];
  const d = prox && new Date(prox.data_hora);
  const fim = p.status === 'finalizado' || feitas >= p.total_sessoes;
  const proxNum = (p.sessoes.find(s => s.status !== 'concluida') || {}).numero;

  const destaque = fim
    ? `<div class="prox"><div><span style="font-size:11px;letter-spacing:.18em;color:#D9C3AC">TRATAMENTO CONCLUÍDO</span><p style="font-size:16px;font-weight:500;margin-top:4px">Parabéns por cuidar de você até o fim.</p></div></div>`
    : d ? `<div class="prox"><div class="cal"><span style="font-size:10px;font-weight:600;letter-spacing:.1em;color:#8E6F5D">${meses[d.getMonth()]}</span><span class="serif" style="font-size:26px;font-weight:700;line-height:1">${d.getDate()}</span></div>
      <div style="display:flex;flex-direction:column;gap:3px"><span style="font-size:11px;letter-spacing:.18em;color:#D9C3AC">PRÓXIMA SESSÃO</span><span style="font-size:16px;font-weight:500">${semana[d.getDay()]} às ${pad(d.getHours())}:${pad(d.getMinutes())}</span>

    : `<div class="prox"><div><span style="font-size:11px;letter-spacing:.18em;color:#D9C3AC">PRÓXIMA SESSÃO</span><p style="font-size:16px;font-weight:500;margin-top:4px">A combinar com a Rauana</p></div></div>`;

  // Pedir horário: só com plano ativo e sessões a fazer
  let agendar = '';
  if (!fim && p.status === 'ativo' && proxNum) {
    if (p.pedido) {
      const pd = new Date(p.pedido.data_hora);
      agendar = `<div class="pedido"><span class="tag">SEU PEDIDO DE HORÁRIO</span><b>${dataLonga(pd)} às ${pad(pd.getHours())}:${pad(pd.getMinutes())}</b>
        <span class="txt">Aguardando a confirmação da Rauana. Ela responde pelo WhatsApp.</span></div>
        <button class="btn" data-acao="escolher">${I.cal} Trocar o horário pedido</button>`;
    } else {
      agendar = `<button class="btn cheio" data-acao="escolher">${I.cal} ${d ? 'Pedir outra data' : 'Escolher data e horário'}</button>

    }
  }

  const lista = p.sessoes.map(s => {
    const dt = s.data_hora ? new Date(s.data_hora) : null;

/* ═══ Escolher data e horário ═══ */
let PK = null;
const livresCache = {};
const diaDe = t => diaKey(new Date(t));
const horaDe = t => { const d = new Date(t); return pad(d.getHours()) + ':' + pad(d.getMinutes()); };
const quando = (dia, hora) => new Date(dia + 'T' + hora + ':00');
const livresDoMes = (ano, mes) => livresCache[`${ano}-${pad(mes + 1)}`] || [];
const horasDoDia = dia => livresDoMes(+dia.slice(0, 4), +dia.slice(5, 7) - 1).filter(t => diaDe(t) === dia).map(horaDe);
async function carregarLivres(ano, mes) {
  const k = `${ano}-${pad(mes + 1)}`;
  if (livresCache[k]) return;
  try {
    const lista = await rpc('horarios_disponiveis', { p_codigo: codigo, p_de: new Date(ano, mes, 1).toISOString(), p_ate: new Date(ano, mes + 1, 1).toISOString() });
    livresCache[k] = (lista || []).map(x => new Date(x).getTime());
  } catch (e) { livresCache[k] = []; }
}
async function abrirEscolha() {
  const base = new Date();
  PK = { ano: base.getFullYear(), mes: base.getMonth(), dia: '', hora: '', carregando: true };
  desenharPicker();
  await carregarLivres(PK.ano, PK.mes);
  // se este mês não tem horário, já mostra o próximo
  if (!livresDoMes(PK.ano, PK.mes).length) { const d = new Date(PK.ano, PK.mes + 1, 1); if (d <= new Date(Date.now() + LIMITE_DIAS * 864e5)) { await carregarLivres(d.getFullYear(), d.getMonth()); if (livresDoMes(d.getFullYear(), d.getMonth()).length) { PK.ano = d.getFullYear(); PK.mes = d.getMonth(); } } }
  if (!PK) return;
  PK.carregando = false; desenharPicker();
}
function desenharPicker() {
  const { ano, mes } = PK, hoje = diaKey(new Date());
  const ini0 = new Date(ano, mes, 1).getDay(), nDias = new Date(ano, mes + 1, 0).getDate();
  const nomeMes = new Date(ano, mes, 1).toLocaleDateString('pt-BR', { month: 'long', year: 'numeric' });
  const agora = new Date(), limite = new Date(); limite.setDate(limite.getDate() + LIMITE_DIAS);
  const podeVoltar = ano > agora.getFullYear() || (ano === agora.getFullYear() && mes > agora.getMonth());
  const podeIr = new Date(ano, mes + 1, 1) <= limite;
  let dias = ['D', 'S', 'T', 'Q', 'Q', 'S', 'S'].map(x => `<span class="sem">${x}</span>`).join('') + '<span></span>'.repeat(ini0);
  for (let d = 1; d <= nDias; d++) {
    const k = `${ano}-${pad(mes + 1)}-${pad(d)}`, ok = !PK.carregando && horasDoDia(k).length > 0;
    dias += `<button type="button" class="${k === PK.dia ? 'on' : ''}${k === hoje ? ' hoje' : ''}" data-acao="pk-dia" data-v="${k}" ${ok ? '' : 'disabled'} aria-label="${d} de ${nomeMes}${ok ? '' : ', indisponível'}">${d}</button>`;
  }
  const horas = PK.dia ? horasDoDia(PK.dia).map(h => `<button type="button" class="chip ${h === PK.hora ? 'on' : ''}" data-acao="pk-hora" data-v="${h}">${h}</button>`).join('') : '';
  const temNoMes = livresDoMes(ano, mes).length > 0;
  const tit = PK.dia ? dataLonga(quando(PK.dia, '12:00')) : 'Escolha o dia';
  $('#picker').innerHTML = `<div class="pk-bg" data-acao="pk-fundo"><div class="sheet" role="dialog" aria-modal="true" aria-label="Escolher data e horário"><div class="grip"></div>
    <div class="entre"><div><span class="tg">Próxima sessão</span><h2 class="serif" style="font-size:25px;font-weight:600;margin-top:2px">${tit}</h2>${PK.hora ? `<span style="font-size:14px;color:#5C4434">às ${PK.hora}</span>` : ''}</div><button type="button" class="ib plain" data-acao="pk-fechar" aria-label="Fechar">${I.x}</button></div>
    <div class="pk-mes"><button type="button" class="ib" data-acao="pk-mes" data-v="-1" aria-label="Mês anterior" ${podeVoltar ? '' : 'disabled'}>${I.esq}</button><b>${nomeMes.charAt(0).toUpperCase() + nomeMes.slice(1)}</b><button type="button" class="ib" data-acao="pk-mes" data-v="1" aria-label="Próximo mês" ${podeIr ? '' : 'disabled'}>${I.dir}</button></div>
    <div class="pk-grade">${dias}</div>
    ${PK.carregando ? '<p class="vazio">Vendo os horários livres...</p>' : PK.dia ? `<div style="display:flex;flex-direction:column;gap:8px"><span class="tg">Horários livres</span><div class="horas">${horas}</div></div>` : (temNoMes ? '<p class="vazio">Os dias em destaque têm horário livre.</p>' : `<p class="vazio">Sem horários livres ${podeIr ? 'neste mês. Veja o próximo' : 'por enquanto. Fale com a Rauana pelo WhatsApp'}.</p>`)}
    <button type="button" class="btn cheio" data-acao="pk-enviar" ${PK.dia && PK.hora && !PK.enviando ? '' : 'disabled'}>${PK.enviando ? 'Enviando...' : 'Enviar pedido para a Rauana'}</button></div></div>`;
}
const fecharPicker = () => { $('#picker').innerHTML = ''; PK = null; };
const ERROS = {
  ocupado: 'Esse horário acabou de ser ocupado. Escolha outro, por favor.',
  muito_cedo: 'Escolha um horário com pelo menos 2 horas de antecedência.',
  indisponivel: 'Esse horário não está mais liberado. Escolha outro, por favor.',
  muito_longe: 'Escolha uma data dentro dos próximos 60 dias.',
  limite: 'Você já fez vários pedidos hoje. Fale com a Rauana pelo WhatsApp.',
  plano_inativo: 'Este tratamento não está mais ativo. Fale com a Rauana pelo WhatsApp.',
};
async function enviarPedido() {
  PK.enviando = true; desenharPicker();
  const dataHora = quando(PK.dia, PK.hora).toISOString();
  try {
    const r = await rpc('pedir_horario', { p_codigo: codigo, p_data_hora: dataHora });
    // avisa o celular da Rauana (se falhar, o pedido continua aparecendo no app dela)
    fetch(`${SB_URL}/functions/v1/avisos`, { method: 'POST', headers: cab, body: JSON.stringify({ acao: 'pedido', id: r.id }), keepalive: true }).catch(() => {});
    P.pedido = { data_hora: r.data_hora || dataHora };
    fecharPicker(); desenhar(); window.scrollTo({ top: 0, behavior: 'smooth' });
    aviso('Pedido enviado! A Rauana vai confirmar pelo WhatsApp.', 5000);
  } catch (e) {
    const m = ERROS[e.codigo] || 'Não foi possível enviar agora. Verifique sua internet e tente de novo.';
    if (e.codigo === 'ocupado' || e.codigo === 'indisponivel') { delete livresCache[PK.dia.slice(0, 7)]; await carregarLivres(PK.ano, PK.mes); PK.hora = ''; if (!horasDoDia(PK.dia).length) PK.dia = ''; }
    PK.enviando = false; desenharPicker(); aviso(m, 5000);
  }
}
document.addEventListener('click', async e => {
  const el = e.target.closest('[data-acao]'); if (!el) return;
  const a = el.dataset.acao;
  if (a === 'escolher') return abrirEscolha();
  if (!PK) return;
  if (a === 'pk-fundo') { if (e.target === el) fecharPicker(); return; }
  if (a === 'pk-fechar') return fecharPicker();
  if (a === 'pk-dia') { PK.dia = el.dataset.v; PK.hora = ''; return desenharPicker(); }
  if (a === 'pk-hora') { PK.hora = el.dataset.v; return desenharPicker(); }
  if (a === 'pk-mes') { const d = new Date(PK.ano, PK.mes + Number(el.dataset.v), 1); PK.ano = d.getFullYear(); PK.mes = d.getMonth(); PK.dia = ''; PK.hora = ''; PK.carregando = true; desenharPicker(); await carregarLivres(PK.ano, PK.mes); if (PK) { PK.carregando = false; desenharPicker(); } return; }
  if (a === 'pk-enviar') { if (PK.dia && PK.hora && !PK.enviando) enviarPedido(); }
});

(async () => {
  if (codigo.length < 12) return erro('Link incompleto. Confira o link enviado pela clínica.');
  try { P = await rpc('plano_publico', { p_codigo: codigo }); }
  catch (e) { return erro('Não conseguimos carregar agora. Verifique sua internet e tente de novo.'); }
  if (!P || P.code) return erro('Não encontramos esse tratamento. Confira o link enviado pela clínica.');
  desenhar();
  if (P.tem_foto) {
    try {
      const r = await fetch(`${SB_URL}/functions/v1/avisos`, { method: 'POST', headers: cab, body: JSON.stringify({ acao: 'foto', c: codigo }) });
      const j = await r.json();
      if (j.url) { FOTO = j.url; desenhar(); }
    } catch (e) {}
  }
})();
</script>
</body>
</html>
